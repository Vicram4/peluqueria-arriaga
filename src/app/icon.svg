<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Poste de barbero: franjas granate y papel sobre verde tinta, con remate de latón. -->
  <defs>
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="8" height="8" fill="#f3ecdd" />
      <rect width="4" height="8" fill="#7a1e2c" />
    </pattern>
    <clipPath id="pole">
      <rect x="11" y="6" width="10" height="20" rx="2" />
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#13261e" />
  <rect x="11" y="6" width="10" height="20" fill="url(#stripe)" clip-path="url(#pole)" />
  <rect x="9.5" y="3.5" width="13" height="3" rx="1.5" fill="#d9b878" />
  <rect x="9.5" y="25.5" width="13" height="3" rx="1.5" fill="#d9b878" />
</svg>
